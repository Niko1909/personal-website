name: Deploy website

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: personal-website
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: personal-website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Astro
        run: npm run check
      - name: Build and test
        run: npm test
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '3346faed2a0087451b2eb6f6d1a55846'
          workingDirectory: personal-website
          command: pages deploy dist --project-name=nikolasmarinkovich --branch=main
